name: Website

# Publishes site/ to https://totalgit.e-path.co.uk (Azure Static Web App "totalgit", see infra/).
# The images in site/img are built from docs/screenshots with tools/make_site_images.py.
on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://totalgit.e-path.co.uk
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ""
          skip_app_build: true
          skip_api_build: true
