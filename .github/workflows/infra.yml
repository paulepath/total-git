name: Infrastructure

# Pulumi (infra/): Azure Static Web App + Cloudflare DNS for the website.
# Pushes and PRs run a preview. Applying is a deliberate second step:
# Actions -> Infrastructure -> Run workflow -> action: apply (review the preview first).
on:
  push:
    branches: [master]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "preview or apply"
        type: choice
        options: [preview, apply]
        default: preview

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  STACK: paulepath/totalgit-infra/prod
  # Pulumi's azure-native provider signs in to Azure with GitHub OIDC itself.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  preview:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ env.STACK }}
          work-dir: infra
          comment-on-pr: true
          diff: true

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment:
      name: infrastructure
      url: https://totalgit.e-path.co.uk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.STACK }}
          work-dir: infra
          diff: true
